name: Keep Render Server Alive

on:
  schedule:
    # Runs every 14 minutes
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Server
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          echo "Pinging server at $(date)"
          response=$(curl -s -o /dev/null -w "%{http_code}" $RENDER_URL/ping)
          if [ $response -eq 200 ]; then
            echo "✅ Ping successful (HTTP $response)"
          else
            echo "❌ Ping failed (HTTP $response)"
            exit 1
          fi
        timeout-minutes: 2

      - name: Log completion
        run: echo "Keep alive ping completed at $(date)"
